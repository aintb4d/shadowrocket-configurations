[Rule]
# Apple
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Shadowrocket/Apple/Apple.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Shadowrocket/Apple/Apple_Domain.list,DIRECT

# Custom lists
RULE-SET,https://raw.githubusercontent.com/aintb4d/shadowrocket-configurations/refs/heads/main/rules/direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/aintb4d/shadowrocket-configurations/refs/heads/main/rules/proxy.list,PROXY

# Российские домены напрямую
GEOIP,RU,DIRECT
DOMAIN-SUFFIX,ru,DIRECT
DOMAIN-SUFFIX,рф,DIRECT
DOMAIN-SUFFIX,xn--p1ai,DIRECT
DOMAIN-SUFFIX,su,DIRECT

# Всё остальное через прокси
FINAL,PROXY

[Host]
# Local hosts
localhost = 127.0.0.1
localdns = 198.18.0.2
localtunnel = 10.7.0.1
localdrop = 0.255.255.255

# Local domains
*.lan = server:system
*.test = server:system
*.internal = server:system
*.home.arpa = server:system

# Captive portals
captive.apple.com = server:system
