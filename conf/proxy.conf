# aintb4d: 2026-11-13
[General]
# Use the system proxy settings together with the TUN interface
bypass-system = true

# Bypass the system HTTP/HTTPS proxy for matching hosts and addresses
skip-proxy = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/3, localhost, *.localhost, *.lan, *.test, *.local, *.internal, *.home.arpa, captive.apple.com

# Bypass the TUN interface for matching network subnets (10.7.0.1 stays inside the tunnel)
tun-excluded-routes = 0.0.0.0/8, 10.0.0.0/14, 10.4.0.0/15, 10.6.0.0/16, 10.7.0.0/32, 10.7.0.2/31, 10.7.0.4/30, 10.7.0.8/29, 10.7.0.16/28, 10.7.0.32/27, 10.7.0.64/26, 10.7.0.128/25, 10.7.1.0/24, 10.7.2.0/23, 10.7.4.0/22, 10.7.8.0/21, 10.7.16.0/20, 10.7.32.0/19, 10.7.64.0/18, 10.7.128.0/17, 10.8.0.0/13, 10.16.0.0/12, 10.32.0.0/11, 10.64.0.0/10, 10.128.0.0/9, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/29, 192.0.0.8/32, 192.0.0.11/32, 192.0.0.12/30, 192.0.0.16/28, 192.0.0.32/27, 192.0.0.64/26, 192.0.0.128/25, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4

# Use the TUN interface for matching network subnets
tun-included-routes = 

# Set the default DNS upstreams (used for proxied traffic)
dns-server = https://1.1.1.1/dns-query#proxy, https://8.8.8.8/dns-query#proxy

# Set the fallback DNS upstreams
fallback-dns-server = https://common.dot.dns.yandex.net/dns-query, system

# Set the proxy hosts resolution DNS upstreams
proxy-dns-server = tls://77.88.8.1, tls://77.88.8.8

# Use system DNS for domains matched to DIRECT
dns-direct-system = true

# Use system DNS as a fallback when the upstream DNS fails
dns-fallback-system = true

# Retry failed DIRECT-domain DNS resolution through the proxy
dns-direct-fallback-proxy = true

# Disable IPv6 DNS resolution and connectivity
ipv6 = false

# Do not prefer IPv6 addresses over IPv4
prefer-ipv6 = false

# Accept private-IP DNS answers without treating them as hijacked
private-ip-answer = true

# Intercept all DNS traffic sent to port 53
hijack-dns = :53

# Return real IP addresses instead of fake IPs for specified domains (empty = keep fake IPs for domain routing)
always-real-ip = 

# Reply to ICMP echo requests automatically
icmp-auto-reply = true

# Apply REJECT URL rewrites outside Config routing mode
always-reject-url-rewrite = false

# Choose the fallback action when a matched policy cannot relay UDP
udp-policy-not-supported-behaviour = REJECT

# Configure the system proxy and TUN compatibility mode
compatibility-mode = 3

# Control QUIC/HTTP3 blocking for direct and proxy traffic
block-quic = always-allow

# Use local host mappings for proxy connections instead of the hostname
use-local-host-item-for-proxy = true

# Allow all DNS record types
allow-dns-all = true

# Allow HTTPS/SVCB queries instead of forcing A/AAAA resolution
allow-dns-svcb = true

# Configuration auto-update
update-url = https://raw.githubusercontent.com/aintb4d/shadowrocket-configurations/refs/heads/main/conf/proxy.conf

