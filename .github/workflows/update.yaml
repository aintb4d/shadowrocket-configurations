name: Update lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build-lists:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Process and Merge Rule Lists
      run: |
        mkdir -p rules
        process_src() {
          curl -sLf "$1" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' || true
        }

        echo "Processing WARP category..."
        (
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Twitch/Twitch.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Pinterest/Pinterest.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GoogleDrive/GoogleDrive.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OneDrive/OneDrive.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Steam/Steam.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Epic/Epic.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Discord/Discord.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Instagram/Instagram.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Twitter/Twitter.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Reddit/Reddit.list"
          process_src "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GitHub/GitHub.list"
        ) | sort -u > rules/smart/WARP.list

        echo "Processing NoResolve category..."
        (
          process_src "https://github.com/toneywhitez/zkeen_rules/releases/latest/download/discord_ips.list"
          process_src "https://github.com/toneywhitez/zkeen_rules/releases/latest/download/meta_ips.list"
          process_src "https://raw.githubusercontent.com/HybridNetworks/whatsapp-cidr/refs/heads/main/WhatsApp/whatsapp_cidr_ipv4.list"
        ) | sort -u | grep -vxF 'IP-CIDR,104.16.0.0/13' > rules/smart/NoResolve.list

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add rules/
        
        if git diff --cached --quiet; then
          echo "No changes found. Everything is up to date."
        else
          git commit -m "Automated update"
          git push
        fi
